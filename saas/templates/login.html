{% extends "base.html" %}
{% block title %}Log in — MailPilot{% endblock %}
{% block content %}
<section class="wrap auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to your MailPilot workspace.</p>
    <form method="post">
      <label>Email
        <input type="email" name="email" required autofocus autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block btn-lg">Log in</button>
    </form>
    <p class="auth-alt">No account? <a href="{{ url_for('signup') }}">Start free</a></p>
  </div>
</section>
{% endblock %}
